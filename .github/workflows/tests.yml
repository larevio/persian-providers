name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
            lowest: true
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.lowest && ' / lowest' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, intl, mbstring, dom
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-lock
      - name: Select compatible test dependencies
        run: >-
          composer require --dev --no-update
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "pestphp/pest-plugin-arch:${{ matrix.pest }}"
          "pestphp/pest-plugin-laravel:${{ matrix.pest }}"
      - run: composer update --with "laravel/framework:${{ matrix.laravel }}" --prefer-dist --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}
      - run: composer audit
      - run: composer prepare
      - run: composer test
      - run: composer analyse
      - if: matrix.php == '8.4' && matrix.laravel == '^13.0'
        run: composer format-check
